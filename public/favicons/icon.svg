<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Casas de Oração</title>
  <desc id="desc">Marcador de localização em verde e creme, com uma entrada dourada e um caminho até ela.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13815c"/>
      <stop offset=".55" stop-color="#086243"/>
      <stop offset="1" stop-color="#043d2b"/>
    </linearGradient>
    <linearGradient id="cream" x1=".1" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#fffbed"/>
      <stop offset="1" stop-color="#ece2c9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffdc78"/>
      <stop offset=".55" stop-color="#f5b43b"/>
